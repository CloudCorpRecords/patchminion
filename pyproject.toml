[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "patchminion"
version = "0.1.0"
description = "PatchMinion — a reproducible GitHub-issue triage agent built on the OpenMinion 0.1 SDK (Cortensor Hackathon #5 entry)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "openminion>=0.1,<0.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
patchminion = "patchminion.cli:main"

[tool.setuptools.packages.find]
include = ["patchminion*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
